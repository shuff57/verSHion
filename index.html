<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>verSHion</title>
  <link data-trunk rel="icon" href="assets/icons/favicon.ico" sizes="48x48" />
  <link data-trunk rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link data-trunk rel="copy-file" href="assets/icons/apple-touch-icon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link data-trunk rel="copy-file" href="assets/icons/site.webmanifest" />
  <link data-trunk rel="copy-file" href="assets/icons/icon-192.png" />
  <link data-trunk rel="copy-file" href="assets/icons/icon-512.png" />
  <link data-trunk rel="copy-file" href="assets/icons/icon-maskable-512.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#2F5D46" />
  <link data-trunk rel="copy-file" href="assets/loading-logo.svg" />
  <link data-trunk rel="copy-dir" href="assets/help" data-target-path="help" />
  <!-- Faces the wasm does not compile in (src/fonts.rs, `fetch`): fetched before the app starts,
       preloaded so they download alongside the wasm. Keep in step with src/fonts.rs (a test checks). -->
  <link data-trunk rel="copy-dir" href="assets/fonts" data-target-path="fonts" />
  <link rel="preload" href="fonts/SourceSans3-Regular.ttf" as="fetch" crossorigin />
  <link rel="preload" href="fonts/SourceSerif4-Semibold.ttf" as="fetch" crossorigin />
  <link rel="preload" href="fonts/SourceSans3-It.ttf" as="fetch" crossorigin />
  <link rel="preload" href="fonts/SourceSans3-Semibold.ttf" as="fetch" crossorigin />
  <link rel="preload" href="fonts/SourceSans3-Bold.ttf" as="fetch" crossorigin />
  <link rel="preload" href="fonts/LiberationMono-Regular.ttf" as="fetch" crossorigin />
  <link rel="preload" href="fonts/LiberationSans-Regular.ttf" as="fetch" crossorigin />
  <link rel="preload" href="fonts/LiberationSans-Bold.ttf" as="fetch" crossorigin />
  <link rel="preload" href="fonts/LiberationSerif-Regular.ttf" as="fetch" crossorigin />
  <link rel="preload" href="fonts/LiberationSerif-Italic.ttf" as="fetch" crossorigin />
  <link rel="preload" href="fonts/LiberationSerif-Bold.ttf" as="fetch" crossorigin />
  <link rel="preload" href="fonts/NotoSans-Regular.ttf" as="fetch" crossorigin />
  <link rel="preload" href="fonts/NotoSans-Medium.ttf" as="fetch" crossorigin />
  <link rel="preload" href="fonts/NotoSans-SemiBold.ttf" as="fetch" crossorigin />
  <link rel="preload" href="fonts/NotoSans-Bold.ttf" as="fetch" crossorigin />
  <link rel="preload" href="fonts/NotoSans-ExtraBold.ttf" as="fetch" crossorigin />
  <!-- hayro's 14 standard PDF fonts (src/fonts.rs, PDF_STANDARD_FONTS), for PDF imports. -->
  <link data-trunk rel="copy-dir" href="assets/pdf-fonts" data-target-path="pdf-fonts" />
  <link rel="preload" href="pdf-fonts/FoxitSans.pfb" as="fetch" crossorigin />
  <link rel="preload" href="pdf-fonts/FoxitSansBold.pfb" as="fetch" crossorigin />
  <link rel="preload" href="pdf-fonts/FoxitSansItalic.pfb" as="fetch" crossorigin />
  <link rel="preload" href="pdf-fonts/FoxitSansBoldItalic.pfb" as="fetch" crossorigin />
  <link rel="preload" href="pdf-fonts/FoxitFixed.pfb" as="fetch" crossorigin />
  <link rel="preload" href="pdf-fonts/FoxitFixedBold.pfb" as="fetch" crossorigin />
  <link rel="preload" href="pdf-fonts/FoxitFixedItalic.pfb" as="fetch" crossorigin />
  <link rel="preload" href="pdf-fonts/FoxitFixedBoldItalic.pfb" as="fetch" crossorigin />
  <link rel="preload" href="pdf-fonts/FoxitSerif.pfb" as="fetch" crossorigin />
  <link rel="preload" href="pdf-fonts/FoxitSerifBold.pfb" as="fetch" crossorigin />
  <link rel="preload" href="pdf-fonts/FoxitSerifItalic.pfb" as="fetch" crossorigin />
  <link rel="preload" href="pdf-fonts/FoxitSerifBoldItalic.pfb" as="fetch" crossorigin />
  <link rel="preload" href="pdf-fonts/FoxitDingbats.pfb" as="fetch" crossorigin />
  <link rel="preload" href="pdf-fonts/FoxitSymbol.pfb" as="fetch" crossorigin />
  <style>
    :root { color-scheme: light dark; }
    /* egui-web's hidden text-input element (the keyboard/IME bridge) sits at the text caret, 1px
       wide, and shows a sliver of the last typed character there; keep its text invisible */
    body > input { color: transparent !important; background: transparent !important; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: #f7f4ed;
      color: #2b211c;
      font-family: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #211c18; color: #ece4dc; }
    }
    #vershion_canvas { display: block; width: 100vw; height: 100vh; }
    #vershion_loading {
      position: fixed; inset: 0; z-index: 2;
      display: grid; place-items: center; text-align: center;
      background: inherit; transition: opacity .35s ease;
    }
    #vershion_loading img {
      width: min(52vw, 340px); height: auto;
      max-height: 60vh;
    }
    #vershion_loading p { margin: 12px 24px; max-width: 46ch; line-height: 1.45; }
    @media (prefers-reduced-motion: reduce) {
      #vershion_loading img { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="vershion_loading">
    <div>
      <img src="loading-logo.svg" alt="Loading verSHion" />
      <noscript><p>verSHion needs JavaScript and WebGL2.</p></noscript>
    </div>
  </div>
  <canvas id="vershion_canvas"></canvas>
  <link data-trunk rel="rust" data-bin="vershion-web" data-wasm-opt="z"
        data-wasm-opt-params="--enable-bulk-memory-opt --enable-nontrapping-float-to-int"
        data-weak-refs />
</body>
</html>
