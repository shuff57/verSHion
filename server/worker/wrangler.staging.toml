# Staging deploy: separate Worker + D1, log-mode mail, localhost origins. Safe to delete.
name = "vershion-pool-staging"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
# Public URLs off between tests; set workers_dev = true and redeploy to bring staging back.
workers_dev = false
preview_urls = false

# share-core's wasm is built here, release and without test features, and its exports checked
# (a package exporting strip_with_seed is refused before anything is bundled).
[build]
command = "sh ../share-core/scripts/build-wasm.sh"

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "vershion-pool-staging"
database_id = "ba6f3a5a-9027-49bd-acc6-41b3ba62138c"
migrations_dir = "migrations"

# Pool bodies (items/), quarantine (quarantine/) and images (blobs/). Private: never a public bucket,
# custom domain or presigned URL; everything is served through the Worker (docs/shared-pool.md
# "Blob rules"). Create it with `wrangler r2 bucket create vershion-pool-staging` before the first deploy.
[[r2_buckets]]
binding = "POOL"
bucket_name = "vershion-pool-staging"

[vars]
# Log-mode mail is only allowed with a localhost APP_URL (src/mail.ts), so links print in `wrangler tail`.
MAIL_MODE = "log"
APP_URL = "http://localhost:5173"
ALLOWED_ORIGINS = "http://localhost:5173"
ADMIN_EMAIL = "shuff57@gmail.com"
AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"

# Workers AI for the /ai/chat/completions relay (docs/ai-harness-spec.md).
[ai]
binding = "AI"

[triggers]
crons = ["17 * * * *"]
# Secrets (wrangler secret put --config wrangler.staging.toml): AUTH_SECRET, POOL_HASH_KEY, and
# SMTP_PASSWORD (or RESEND_API_KEY) once mail is real: staging is log mode today. Vars for SMTP:
# SMTP_HOSTNAME, SMTP_PORT, SMTP_USERNAME, SMTP_FROM_NAME, MAIL_FROM.
