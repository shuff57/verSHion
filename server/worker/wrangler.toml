name = "vershion-pool"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Argon2id at m=19 MiB needs the paid Workers plan (see docs/phase1-argon2-spike.md).

# Served only on the custom domain's route (add a [[routes]] entry before the first deploy): no
# public *.workers.dev address and no preview URLs that would bypass it.
workers_dev = false
preview_urls = false

# share-core's wasm is built here, release and without test features, and its exports checked
# (a package exporting strip_with_seed is refused before anything is bundled).
[build]
command = "sh ../share-core/scripts/build-wasm.sh"

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "vershion-pool"
# Replace with the id from `wrangler d1 create vershion-pool` before the first deploy.
database_id = "00000000-0000-0000-0000-000000000000"
# Package migrations (0001-0099) are copied here by scripts/sync-migrations.sh; worker-owned ones
# start at 0100. npm test checks the copies match the package.
migrations_dir = "migrations"

# Pool bodies (items/), quarantine (quarantine/) and images (blobs/). Private: never a public bucket,
# custom domain or presigned URL; everything is served through the Worker (docs/shared-pool.md
# "Blob rules"). Create it with `wrangler r2 bucket create vershion-pool` before the first deploy.
[[r2_buckets]]
binding = "POOL"
bucket_name = "vershion-pool"

[vars]
ALLOWED_ORIGINS = "https://app.example.org"
APP_URL = "https://app.example.org"
# The AI relay calls OpenRouter first (secret OPENROUTER_API_KEY, optional OPENROUTER_MODEL, default
# google/gemma-4-26b-a4b-it) and falls back to Workers AI below (docs/ai-harness-spec.md). The client's
# `model` field is ignored. AI_DAILY_USD caps what the relay may spend in a UTC day (default 5; a fallback
# turn's neurons are booked at $0.000011 each).
AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"

# Workers AI: the fallback upstream. Inference is billed to this account.
[ai]
binding = "AI"

# Secrets (wrangler secret put): AUTH_SECRET, POOL_HASH_KEY (32+ chars; without it the pool answers 503),
# AI_RELAY_KEY (the desktop app's key to the AI relay), and SMTP_PASSWORD when mail goes through SMTP
# (src/mail_smtp.ts) — or RESEND_API_KEY when it goes through Resend. Vars: SMTP_HOSTNAME, SMTP_PORT,
# SMTP_USERNAME, SMTP_FROM_NAME, MAIL_FROM, ADMIN_EMAIL.

[triggers]
crons = ["17 * * * *"]
