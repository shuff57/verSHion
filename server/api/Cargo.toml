[package]
name = "vershion-api"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The verSHion pool, AI relay and billing server: the Rust successor to server/worker (docs/hosting-port.md)."
rust-version = "1.92"

[dependencies]
# The same crate the app and the Worker's wasm use, called natively: one set of rules everywhere.
share-core = { path = "../share-core" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
hmac = "0.12"
sha2 = "0.10"
flate2 = "1"
crc32fast = "1"
hkdf = "0.12"
getrandom = "0.2"
# Pinned like share-core: the character rules depend on these tables.
unicode-normalization = "=0.1.25"
unicode-general-category = "=1.1.0"
url = "=2.5.8"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "rustls", "ring", "webpki-roots"] }
serde_urlencoded = "0.7"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
http-body = "1"
