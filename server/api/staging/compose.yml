# /opt/vershion-staging/compose.yml on the VPS. Two containers, no published ports:
#   api    the Rust server, reachable only by caddy on the private network `backend`
#   caddy  routes API paths to api and serves the app's web build; joins the existing `pangolin_frontend` network so the
#          cloudflared (or Traefik) already there can reach it as http://vershion-staging-caddy:80
# Nothing here touches the other containers (Pangolin, Stalwart, Bulwark, cloudflared, mom-render).
name: vershion-staging

services:
  api:
    build: .
    image: vershion-staging-api:local
    container_name: vershion-staging-api
    restart: unless-stopped
    env_file: /etc/vershion-staging/api.env
    environment:
      # Inside the container the server must listen on the container's address; the network is private.
      VERSHION_LISTEN: 0.0.0.0:8787
      VERSHION_DB: /data/pool.db
      VERSHION_BLOBS: /data/blobs
      VERSHION_MIGRATIONS: /app/migrations
    volumes:
      - /var/lib/vershion-staging:/data
      - /opt/vershion-staging/migrations:/app/migrations:ro
      - /opt/vershion-staging/vershion-api:/app/vershion-api:ro
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [backend]

  caddy:
    image: caddy:2-alpine
    container_name: vershion-staging-caddy
    restart: unless-stopped
    depends_on: [api]
    volumes:
      - /opt/vershion-staging/Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/www/vershion-staging:/srv:ro
    cap_drop: [ALL]
    # The image's caddy binary carries a file capability to bind :80; without this it fails to exec.
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    networks: [backend, pangolin_frontend]

networks:
  backend:
    driver: bridge
  pangolin_frontend:
    external: true
