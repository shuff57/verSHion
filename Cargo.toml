[package]
name = "vershion"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Turn anything into an exam: local question banks, exam layout, and AI conversion. verSHion — a Rust clone of Test Parrot."
rust-version = "1.92"

[[bin]]
name = "vershion"
path = "src/main.rs"

[[bin]]
name = "vershion-web"
path = "src/web_main.rs"

# Shared pool (src/share): how a release is built.
# - The pool server is fixed when the app is built:
#     VERSHION_POOL_URL=https://api.example.org cargo build --release
#     VERSHION_POOL_URL=https://api.example.org trunk build --release   (web)
#   build.rs refuses an invalid address (https only; http://localhost only in debug builds).
# - Without it a release build has sharing switched off ("not set up"): no password page at all.
# - Typing a server address in the app exists only in debug builds, or with the feature below.
[features]
# Development only: typed pool server addresses in a release build. OFF by default; never ship
# with it (anyone at the keyboard could point the app at their own server).
pool-custom-server = []

[build-dependencies]
url = "2"   # build.rs checks VERSHION_POOL_URL

[dependencies]
egui = "0.36"
log = "0.4"
# std clocks panic on wasm32; this is std's clock natively and the browser's in a page.
web-time = "1"
# Pure-Rust PDF rasterizer: page previews and PDF imports on the web (no pdftoppm). Its 14
# standard fonts (`embed-fonts`) are compiled in natively only; the web build fetches the same
# files (assets/pdf-fonts, src/fonts.rs `PDF_STANDARD_FONTS`).
hayro = { version = "0.8", default-features = false, features = ["embed-cmaps"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
sha2 = "0.10"
zip = { version = "3", default-features = false, features = ["deflate"] }
roxmltree = "0.20"  # already in the tree via resvg/usvg; DOM reader for Moodle XML, QTI and .xlsx
equashion-math = { git = "https://github.com/shuff57/equaSHion", rev = "3d3b840c65d7b6e0e7933c6cd95e171384fdfb54" }
equashion-layout = { git = "https://github.com/shuff57/equaSHion", rev = "3d3b840c65d7b6e0e7933c6cd95e171384fdfb54", features = ["extra-fonts"] }
equashion-render = { git = "https://github.com/shuff57/equaSHion", rev = "3d3b840c65d7b6e0e7933c6cd95e171384fdfb54", features = ["raster", "extra-fonts"] }
equashion-egui = { git = "https://github.com/shuff57/equaSHion", rev = "3d3b840c65d7b6e0e7933c6cd95e171384fdfb54" }
equashion-font = { git = "https://github.com/shuff57/equaSHion", rev = "3d3b840c65d7b6e0e7933c6cd95e171384fdfb54" }  # already in the tree via equashion-layout; its bundled STIX Two Math is the PDF's fallback face (src/fonts.rs)
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts"] }
ttf-parser = "0.25"  # already in the tree via resvg/fontdb; PDF font metrics + subsetting (src/fonts.rs)
flate2 = "1"         # already in the tree via zip/png; FlateDecode for embedded PDF fonts
# "subset" cuts the icon face down to the icons the app uses (theme::icons) at compile time; it
# turns on every variant's constants, but only the subset's bytes reach the binary.
egui-phosphor = { version = "0.14", default-features = false, features = ["regular", "subset"] }
# Shared-pool client (src/share): secrets are wiped from memory when dropped; the server address is parsed strictly.
zeroize = "1"
url = "2"
idna = "1"   # already in the tree via url; shows an IDN host in Unicode beside its punycode

[dev-dependencies]
# tests/share_core_fixtures.rs: the pool's payload rules (validate/strip/hash) checked against these
# model types and the real figure registry. Native tests only; the app itself does not link it yet.
share-core = { path = "server/share-core" }
# figuresui tests (data_entry, graph canvas): drive the real controls with simulated typing, paste, clicks and drags.
egui_kittest = "0.36"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hayro = { version = "0.8", default-features = false, features = ["embed-fonts"] }
eframe ={ version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
rfd = "0.17"
ureq = { version = "3", features = ["platform-verifier"] }
# Shared-pool refresh and device tokens live in the OS keychain (src/share/vault.rs): macOS Keychain,
# Windows Credential Manager, or a Secret Service on Linux (GNOME Keyring, KWallet). The Linux store
# is the pure-Rust zbus client, so building needs no libdbus headers; running needs a Secret Service.
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# getrandom (pulled in by the dependency graph) needs its JS backend on wasm32-unknown-unknown.
getrandom = { version = "0.2", features = ["js"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "links"] }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
rexie = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlInputElement",
    "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "File", "FileList", "FileReader",
    "Navigator", "Storage", "StorageManager", "Event", "EventTarget", "Headers", "Request", "RequestInit",
    "RequestMode", "Response", "ReadableStream", "ReadableStreamDefaultReader", "AbortSignal",
    "AbortController", "MediaQueryList", "Location", "Crypto", "SubtleCrypto", "Performance", "Node",
    "RequestCredentials", "RequestRedirect", "History",
] }

# Size first: Cloudflare Pages rejects any file over 25 MiB, and the web build's wasm is one file.
# Measured on the wasm after wasm-opt -Oz: thin LTO + opt-level 3 gave 27.3 MiB, this 19.9 MiB;
# opt-level "z" came out larger (20.4 MiB).
[profile.release]
strip = true
lto = "fat"
opt-level = "s"
codegen-units = 1
panic = "abort"

# opt-level "z" shrinks some crates' wasm and grows others', so it is set per package (measured
# on the wasm after wasm-opt, against everything at "s"): verSHion's own code -1.0 MiB, the
# equaSHion crates -0.07 MiB, hayro -0.12 MiB. Every other dependency at "z" came out 1.85 MiB
# larger, so they stay at "s". egui/epaint at "z" would save another 0.19 MiB but they run every
# frame, so they stay at "s" too.
[profile.release.package.vershion]
opt-level = "z"
strip = true  # restated: with only opt-level here, the linked binaries kept their symbol names
[profile.release.package.equashion-math]
opt-level = "z"
[profile.release.package.equashion-layout]
opt-level = "z"
[profile.release.package.equashion-render]
opt-level = "z"
[profile.release.package.equashion-font]
opt-level = "z"
[profile.release.package.equashion-egui]
opt-level = "z"
[profile.release.package.hayro]
opt-level = "z"
[profile.release.package.hayro-interpret]
opt-level = "z"
[profile.release.package.hayro-syntax]
opt-level = "z"
[profile.release.package.hayro-jbig2]
opt-level = "z"
[profile.release.package.hayro-jpeg2000]
opt-level = "z"
